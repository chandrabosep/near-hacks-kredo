<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Credits starter</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; }
      button, a.btn { font: inherit; padding: 10px 16px; border-radius: 12px; border: 0; background: #0066ff; color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
      pre { background: #f5f5f5; padding: 12px; border-radius: 10px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Jokes, 1 credit each.</h1>
    <p id="state">Loading…</p>
    <p><a class="btn" id="connect" href="/connect">Connect credits</a> <button id="joke" hidden>Tell me a joke</button></p>
    <pre id="out" hidden></pre>
    <script type="module">
      // A visitor id stands in for your own login.
      const v = new URLSearchParams(location.search).get("v") ?? localStorage.getItem("v") ?? crypto.randomUUID();
      localStorage.setItem("v", v);
      const headers = { "content-type": "application/json", "x-visitor": v };
      document.getElementById("connect").href = `/connect?v=${v}`;

      const show = (s) => {
        const u = s.user;
        document.getElementById("state").textContent = u?.connected ? `${u.spendable.credits} credits spendable here` : "Not connected yet.";
        document.getElementById("connect").hidden = !!u?.connected;
        document.getElementById("joke").hidden = !u?.connected;
      };

      // Back from the connect page with ?code=: swap it on the server.
      const code = new URLSearchParams(location.search).get("code");
      if (code) {
        history.replaceState(null, "", "/");
        show(await (await fetch("/api/connected", { method: "POST", headers, body: JSON.stringify({ code }) })).json());
      } else {
        show(await (await fetch("/api/me", { headers })).json());
      }

      document.getElementById("joke").onclick = async () => {
        const res = await fetch("/api/joke", { method: "POST", headers, body: JSON.stringify({ id: crypto.randomUUID() }) });
        const body = await res.json();
        const out = document.getElementById("out");
        out.hidden = false;
        out.textContent = body.joke ?? `${body.error}${body.buy ? `\nBuy more: ${body.buy}` : ""}`;
        show(await (await fetch("/api/me", { headers })).json());
      };
    </script>
  </body>
</html>
