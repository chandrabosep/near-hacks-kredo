# Render Blueprint: the API and its Postgres database. The hosted pages run on Vercel.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
databases:
  - name: kredo-db
    plan: basic-256mb
    region: singapore
    databaseName: kredo
    user: kredo

services:
  - type: web
    name: kredo-api
    runtime: node
    # Starter or above: free services sleep, which would stop the indexer.
    plan: starter
    region: singapore
    buildCommand: npm ci --workspace @credits/api && npm run build -w @credits/api
    startCommand: npm start -w @credits/api
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEAR_NETWORK
        value: testnet
      - key: DATABASE_URL
        fromDatabase:
          name: kredo-db
          property: connectionString
      # The relayer's key (ed25519:...). Its account comes from contracts/deployments/testnet.json.
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      # The Vercel URL of the hosted pages, comma separated if more than one.
      - key: WEB_ORIGINS
        sync: false

