# Render Blueprint: the API, its Postgres database and the hosted pages.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
databases:
  - name: kredo-db
    plan: basic-256mb
    region: singapore
    databaseName: kredo
    user: kredo

services:
  - type: web
    name: kredo-api
    runtime: node
    # Starter or above: free services sleep, which would stop the indexer.
    plan: starter
    region: singapore
    buildCommand: npm ci --workspace @credits/api && npm run build -w @credits/api
    startCommand: npm start -w @credits/api
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CHAIN_ID
        value: "1874"
      - key: DATABASE_URL
        fromDatabase:
          name: kredo-db
          property: connectionString
      - key: OPERATOR_KEY
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WEB_ORIGINS
        value: https://kredo-web.onrender.com

  - type: web
    name: kredo-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --workspace @credits/web && npm run build -w @credits/web
    startCommand: npm start -w @credits/web
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://kredo-api.onrender.com
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "1874"
