[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 256

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"

[invariant]
runs = 64
depth = 200
fail_on_revert = true

# Longer fuzz and invariant campaigns: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 5_000

[profile.deep.invariant]
runs = 512
depth = 500
fail_on_revert = true
